project_id = "odawqbevdzpkwkxbggnf"

# doubt-solver verifies the caller's JWT itself (auth.getClaims) and rejects
# anonymous requests, so gateway-level verification stays disabled to keep
# compatibility with Supabase's asymmetric signing keys.
[functions.doubt-solver]
verify_jwt = false

# Versioned service API (/v1). Verifies JWTs itself so public routes work.
[functions.api]
verify_jwt = false

# Job runner, called by pg_cron with the x-worker-secret header.
[functions.worker]
verify_jwt = false

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      radix-ui:
        patterns: ["@radix-ui/*"]
      types:
        patterns: ["@types/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

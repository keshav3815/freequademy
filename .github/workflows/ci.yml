name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          # Public placeholder values only — the build never talks to Supabase.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder

  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: coverage
          retention-days: 14

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: >
          docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1
          git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore

  database-tests:
    # Also the migration validation: every migration is applied from scratch,
    # in order, on production's Postgres version before the suite runs.
    name: Migrations + database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-db.sh

  e2e-tests:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,mailpit,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Capture local Supabase keys
        id: keys
        run: |
          supabase status -o json > /tmp/status.json
          echo "url=$(jq -r .API_URL /tmp/status.json)" >> "$GITHUB_OUTPUT"
          echo "anon=$(jq -r .ANON_KEY /tmp/status.json)" >> "$GITHUB_OUTPUT"
          echo "service=$(jq -r .SERVICE_ROLE_KEY /tmp/status.json)" >> "$GITHUB_OUTPUT"
      - run: npx playwright test
        env:
          E2E_SUPABASE_URL: ${{ steps.keys.outputs.url }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ steps.keys.outputs.anon }}
          E2E_SUPABASE_SECRET_KEY: ${{ steps.keys.outputs.service }}
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

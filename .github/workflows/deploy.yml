name: Deploy

# Controlled database + Edge Function deployment (Architecture V1 CI/CD).
# Staging first; production only after staging succeeded AND a reviewer
# approves the "production" GitHub Environment (Settings → Environments →
# production → Required reviewers). Never runs on its own: manual dispatch only,
# and only when DEPLOY_ENABLED=true. Migrations are applied with
# `supabase db push`, which records history, so nothing is applied by hand.
#
# Required per environment (Settings → Environments → staging / production):
#   secrets   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
#   variables SUPABASE_PROJECT_REF

on:
  workflow_dispatch:
    inputs:
      target:
        description: "staging, or production (staging runs first either way)"
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.100.1
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
      - name: Pending migrations (dry run)
        run: supabase db push --dry-run --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
      - name: Apply migrations
        run: supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
      - name: Deploy Edge Functions
        run: |
          for f in api doubt-solver worker; do supabase functions deploy "$f" --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"; done
      - name: Refuse to ship removed payment functions
        run: |
          supabase functions list --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" | tee functions.txt
          ! grep -E "verify-payment|create-razorpay-order" functions.txt

  production:
    if: ${{ vars.DEPLOY_ENABLED == 'true' && inputs.target == 'production' }}
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.100.1
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
      - name: Pending migrations (dry run)
        run: supabase db push --dry-run --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
      - name: Apply migrations
        run: supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
      - name: Deploy Edge Functions
        run: |
          for f in api doubt-solver worker; do supabase functions deploy "$f" --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"; done
      - name: Refuse to ship removed payment functions
        run: |
          supabase functions list --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" | tee functions.txt
          ! grep -E "verify-payment|create-razorpay-order" functions.txt
